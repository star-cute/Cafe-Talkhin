
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کافه تلخین | ورود و رزرو میز</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="background-overlay"></div>

    <div class="coffee-beans">
        <span>☕</span>
        <span>✦</span>
        <span>☕</span>
        <span>✧</span>
        <span>☕</span>
    </div>

    <main class="container">

        <div class="circle-container" id="circleContainer"></div>

        <section class="login-box">

            <div class="logo">
                <i class="fa-solid fa-mug-hot"></i>
            </div>

            <h1>کافه تلخین</h1>

            <p class="subtitle">
                لحظات دلنشین، با یک فنجان قهوه آغاز می‌شوند
            </p>

            <div class="welcome-text">
                <h2>خوش آمدید!</h2>
                <p>برای رزرو میز وارد حساب کاربری خود شوید.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>

                    <input type="email"
                        id="email"
                        placeholder="ایمیل خود را وارد کنید"
                        required>
                </div>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input type="password"
                        id="password"
                        placeholder="رمز عبور"
                        required>

                    <i class="fa-regular fa-eye toggle-password"
                        id="togglePassword"></i>

                </div>

                <div class="form-options">

                    <label>
                        <input type="checkbox">
                        مرا به خاطر بسپار
                    </label>

                    <a href="#">فراموشی رمز عبور؟</a>

                </div>

                <button type="submit" class="login-btn">
                    ورود به حساب کاربری
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

            </form>

            <div class="divider">
                <span>یا</span>
            </div>

            <div class="signup-link">
                حساب کاربری ندارید؟
                <a href="#">ثبت‌نام کنید</a>
            </div>

            <a href="menu.html" class="guest-link">
                مشاهده منوی کافی‌شاپ
                <i class="fa-solid fa-mug-saucer"></i>
            </a>
            <br>
            <a href="index.html" class="guest-link">
               صفحه اصلی
                <i class="fa-solid fa-mug-saucer"></i>
            </a>

        </section>

        <div class="coffee-caption">
            <span>COFFEE</span>
            <p>Every cup tells a story...</p>
        </div>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
